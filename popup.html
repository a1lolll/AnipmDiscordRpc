<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #202225;
      color: #f1f1f1;
    }
    h3 { margin-top: 0; color: #5865F2; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #b9bbbe; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background-color: #2f3136;
      border: 1px solid #202225;
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    input[type="text"]:focus { border-color: #5865F2; outline: none; }
    .switch-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #2f3136; }
    .switch-label { font-size: 14px; font-weight: bold; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4f545c; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #3ba55d; }
    input:checked + .slider:before { transform: translateX(20px); }
    .status-msg { font-size: 11px; text-align: center; color: #3ba55d; margin-top: 8px; font-weight: bold; display: none; }
  </style>
</head>
<body>
  <h3>ani.pm Discord RPC</h3>
  
  <div class="field">
    <label for="token">Discord Token</label>
    <input type="text" id="token" placeholder="Paste your token here...">
  </div>

  <div class="switch-container">
    <span class="switch-label">Extension Status</span>
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div id="status" class="status-msg">Saved successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
