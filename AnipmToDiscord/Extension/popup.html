<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2d;
      --card-border: #2a2e45;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --text-main: #e2e8f0;
      --text-sub: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      width: 260px;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .github-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .github-btn:hover {
      color: var(--text-main);
      background: var(--card-border);
      transform: translateY(-1px);
    }

    .github-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .group-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 14px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-size: 13px;
    }

    .radio-option:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .radio-option input[type="radio"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-sub);
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
      margin: 0;
      transition: all 0.15s ease;
    }

    .radio-option input[type="radio"]:checked {
      border-color: var(--accent);
      background: var(--accent);
    }

    .radio-option input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    .toggle-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2e334d;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h3>Ani.pm RPC</h3>
    </div>
    <button id="githubBtn" class="github-btn" title="View on GitHub">
      <svg viewBox="0 0 24 24">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    </button>
  </div>

  <div class="section-title">Large Image</div>
  <div class="group-box">
    <label class="radio-option">
      <input type="radio" name="mainImageType" value="banner" checked>
      <span>Anime Banner</span>
    </label>
    <label class="radio-option">
      <input type="radio" name="mainImageType" value="logo">
      <span>ani.pm Logo</span>
    </label>
  </div>

  <div class="section-title">Small Badge</div>
  <div class="toggle-option">
    <span>Show ani.pm Logo</span>
    <label class="switch">
      <input type="checkbox" id="showSmallLogo" checked>
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
